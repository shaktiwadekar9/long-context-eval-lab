[project]
name = "long-context-eval-lab"
version = "0.1.0"
description = "A lightweight evaluation pipeline for testing how well long-context LLMs use provided context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
lc-eval = "long_context_eval_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/long_context_eval_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
